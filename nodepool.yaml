################################################################################
# Karpenter NodePool - x86 Spot workloads
# Capped at 4xlarge maximum.
################################################################################

apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default-x86-spot
spec:
  template:
    metadata:
      labels:
        workload-arch: amd64
        capacity-type: spot

    spec:
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values:
            - amd64

        - key: kubernetes.io/os
          operator: In
          values:
            - linux

        - key: karpenter.sh/capacity-type
          operator: In
          values:
            - spot

        - key: karpenter.k8s.aws/instance-category
          operator: In
          values:
            - c
            - m
            - r

        - key: karpenter.k8s.aws/instance-size
          operator: In
          values:
            - large
            - xlarge
            - 2xlarge
            - 4xlarge

        - key: node.kubernetes.io/instance-type
          operator: In
          values:
            - m6i.large
            - m6i.xlarge
            - m6i.2xlarge
            - m6i.4xlarge
            - m6a.large
            - m6a.xlarge
            - m6a.2xlarge
            - m6a.4xlarge
            - m7i.large
            - m7i.xlarge
            - m7i.2xlarge
            - m7i.4xlarge
            - m7i-flex.large
            - m7i-flex.xlarge
            - m7i-flex.2xlarge
            - c6i.large
            - c6i.xlarge
            - c6i.2xlarge
            - c6i.4xlarge
            - c6a.large
            - c6a.xlarge
            - c6a.2xlarge
            - c6a.4xlarge
            - c7i.large
            - c7i.xlarge
            - c7i.2xlarge
            - c7i.4xlarge
            - r6i.large
            - r6i.xlarge
            - r6i.2xlarge
            - r6i.4xlarge
            - r6a.large
            - r6a.xlarge
            - r6a.2xlarge
            - r6a.4xlarge
            - r7i.large
            - r7i.xlarge
            - r7i.2xlarge
            - r7i.4xlarge
            - m8i.large
            - m8i.xlarge
            - m8i-flex.large
            - m8i-flex.xlarge

      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default-x86

      expireAfter: 720h

  limits:
    cpu: "1000"

  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30s

---
################################################################################
# Karpenter NodePool - ARM Graviton Spot workloads
# Capped at 4xlarge maximum.
################################################################################

apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default-arm-spot
spec:
  template:
    metadata:
      labels:
        workload-arch: arm64
        capacity-type: spot

    spec:
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values:
            - arm64

        - key: kubernetes.io/os
          operator: In
          values:
            - linux

        - key: karpenter.sh/capacity-type
          operator: In
          values:
            - spot

        - key: karpenter.k8s.aws/instance-category
          operator: In
          values:
            - c
            - m
            - r

        - key: karpenter.k8s.aws/instance-size
          operator: In
          values:
            - large
            - xlarge
            - 2xlarge
            - 4xlarge

        - key: node.kubernetes.io/instance-type
          operator: In
          values:
            - m7g.large
            - m7g.xlarge
            - m7g.2xlarge
            - m7g.4xlarge
            - m6g.large
            - m6g.xlarge
            - m6g.2xlarge
            - m6g.4xlarge
            - c7g.large
            - c7g.xlarge
            - c7g.2xlarge
            - c7g.4xlarge
            - c6g.large
            - c6g.xlarge
            - c6g.2xlarge
            - c6g.4xlarge
            - r7g.large
            - r7g.xlarge
            - r7g.2xlarge
            - r7g.4xlarge
            - r6g.large
            - r6g.xlarge
            - r6g.2xlarge
            - r6g.4xlarge

      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default-arm

      expireAfter: 720h

  limits:
    cpu: "500"

  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30s

---
################################################################################
# EC2NodeClass - x86
#
# The instance profile is created and managed by the dedicated IAM Terraform
# IaC. Subnets and security groups are discovered through the
# karpenter.sh/ekscluster tag.
################################################################################

apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default-x86
spec:
  amiFamily: AL2023

  instanceProfile: "${karpenter_node_instance_profile_name}"

  amiSelectorTerms:
    - alias: al2023@latest

  subnetSelectorTerms:
    - id: subnet-03ec687d6df05d5ec
    - id: subnet-04428af07dbc00d03
    - id: subnet-0a44981d7bb077d0b

  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/ekscluster: "${cluster_name}"

  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 2
    httpTokens: required

---
